[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/gateway/Dockerfile"

[build.args]
REACT_APP_API_URL = "https://www.katariastoneworld.com"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# BACKEND_URL defaults to https://api.katariastoneworld.com in deploy/gateway/Dockerfile.
# Override in Railway Variables, or import railway.env via RAW editor.
